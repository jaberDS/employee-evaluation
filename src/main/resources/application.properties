spring.application.name=employee-evaluation
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/employee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

jwt.secret=employee-evaluation-jwt-secret-key-32-bytes-minimum
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# ==================== WEBAUTHN / PASSKEYS ====================
# rp-id : suffixe de domaine enregistrable, sans port ni schema.
# En production : evaluation.atb.com.tn + origines en HTTPS (obligatoire,
# localhost etant la seule exemption de contexte securise).
# Changer rp-id invalide TOUTES les cles deja enrolees.
webauthn.rp-id=localhost
webauthn.rp-name=ATB - Evaluation des employes
webauthn.origins=http://localhost:4200
webauthn.timeout-ms=120000

# Duree de vie des jetons d'etape MFA
mfa.pending-expiration=300000
mfa.reset-expiration=600000


# ==================== RECONNAISSANCE FACIALE ====================
# Microservice Python (FastAPI + InsightFace buffalo_l), demarre par
# face-service/start.bat. Il n'ecoute que sur la boucle locale et n'a aucune
# authentification propre : ne jamais l'exposer publiquement.
face.service.url=http://127.0.0.1:8000
# Une ceremonie envoie une rafale de trames (3 consignes x 4) et chacune coute
# une detection complete sur CPU. 20 s suffisaient pour une trame unique, plus
# pour une rafale : le client Spring coupait la lecture en cours de reponse et
# l'utilisateur voyait une erreur de type de contenu illisible.
face.service.timeout-ms=90000

# Similarite cosinus minimale entre le gabarit et le visage presente.
# 0.42 est un point de depart pour ArcFace R100 ; a recalibrer sur la
# population reelle avant mise en production.
face.match-threshold=0.42

# Qualite minimale exigee a l'inscription (pas a la verification).
face.min-enroll-quality=0.45

# Duree de vie d'une ceremonie faciale : la capture guidee prend ~15 s,
# 3 minutes laissent le temps de recommencer.
face.ceremony-timeout-ms=180000

# ==================== ASSISTANT IA ====================
# Assistant de navigation et de consultation (Gemini, palier gratuit).
#
# La cle reste cote serveur : le navigateur appelle /api/assistant/ask et ne
# voit jamais ce secret. Obtenir une cle sur https://aistudio.google.com/apikey
# Laisser vide desactive proprement l'assistant, qui se masque cote client.
#
# En production, preferer la variable d'environnement ASSISTANT_GEMINI_API_KEY
# plutot qu'une cle ecrite dans ce fichier suivi par git.
assistant.gemini.api-key=${ASSISTANT_GEMINI_API_KEY:}

# gemini-flash-latest suit automatiquement le dernier modele Flash stable.
assistant.gemini.model=gemini-flash-latest
assistant.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
assistant.gemini.timeout-ms=20000
