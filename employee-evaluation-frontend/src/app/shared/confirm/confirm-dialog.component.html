@if (state; as req) {
  <div class="confirm-overlay" @backdropFade (click)="onCancel()" role="presentation">
    <div
      class="confirm-modal confirm-{{ req.confirmColor || 'danger' }}"
      @modalPop
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      aria-describedby="confirm-desc">
      <div class="confirm-modal-pattern" aria-hidden="true"></div>

      <div class="confirm-icon">
        <app-lucide-icon [name]="req.icon || 'alert-triangle'" [size]="26"></app-lucide-icon>
      </div>

      <h3 id="confirm-title" class="confirm-title">{{ req.title }}</h3>

      @if (req.message) {
        <p id="confirm-desc" class="confirm-message">{{ req.message }}</p>
      }

      <div class="confirm-actions">
        <button
          type="button"
          class="confirm-btn confirm-btn-cancel"
          (click)="onCancel()"
          [disabled]="loading">
          {{ req.cancelText || 'Annuler' }}
        </button>

        <button
          type="button"
          class="confirm-btn confirm-btn-confirm"
          (click)="onConfirm()"
          [disabled]="loading">
          @if (loading) {
            <span class="confirm-spinner" aria-hidden="true"></span>
          } @else {
            <app-lucide-icon [name]="req.icon || 'trash-2'" [size]="16"></app-lucide-icon>
          }
          <span>{{ loading ? (req.loadingText || 'Suppression...') : (req.confirmText || 'Supprimer') }}</span>
        </button>
      </div>
    </div>
  </div>
}
