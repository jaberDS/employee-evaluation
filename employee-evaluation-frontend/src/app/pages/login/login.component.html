<div class="login-container">
  <!-- Loading overlay -->
  <div class="loading-overlay" *ngIf="isLoading" @fadeInOut>
    <div class="loader-wrapper">
      <span class="loader-letter">L</span>
      <span class="loader-letter">o</span>
      <span class="loader-letter">a</span>
      <span class="loader-letter">d</span>
      <span class="loader-letter">i</span>
      <span class="loader-letter">n</span>
      <span class="loader-letter">g</span>
      <div class="loader"></div>
    </div>
  </div>

  <div class="brand-panel">
    <div class="decorative-circles">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="brand-content">
      <img class="logo" src="assets/atb-logo.png" alt="ATB logo" />

      <h1>ATB</h1>
      <p class="tagline">Employee Evaluation Platform</p>
    </div>
  </div>

  <div class="form-panel">
    <div class="form-card">
      <div *ngIf="successMessage" class="status-banner success-banner" @slideDown role="status">
        {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="status-banner error-banner" @slideDown role="alert">
        {{ errorMessage }}
      </div>

      <div class="form-header">
        <h2>Connexion</h2>
        <p>Veuillez vous authentifier</p>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="form-group" @staggerIn>
          <label for="matricule">Matricule</label>
          <div class="input-icon">
            <input
              id="matricule"
              type="text"
              name="matricule"
              [(ngModel)]="matricule"
              required
              autocomplete="username"
              placeholder="Votre matricule"
              [disabled]="isLoading"
            />
          </div>
        </div>

        <div class="form-group" @staggerIn>
          <label for="password">Mot de passe</label>
          <div class="input-icon">
            <input
              id="password"
              type="password"
              name="password"
              [(ngModel)]="password"
              required
              autocomplete="current-password"
              placeholder="Votre mot de passe"
              [disabled]="isLoading"
            />
          </div>
        </div>

        <button class="btn-primary" type="submit" [disabled]="isLoading">
          Se connecter
        </button>
      </form>
    </div>
  </div>
</div>
